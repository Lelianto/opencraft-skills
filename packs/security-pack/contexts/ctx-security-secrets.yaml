id: ctx-security-secrets
version: 1
title: Secrets must be stored in a secret manager and never committed
description: >
  Credentials, tokens, and keys MUST be provisioned from a secret manager or
  environment at runtime and MUST NOT be committed to the repository, build
  logs, client bundles, or fixtures. Secrets MUST be rotated on exposure and
  scoped to the least privilege required.
applies_to:
  - "**/*"
category: security
severity: critical
tags: [security, secrets]
source:
  type: standard-body
  uri: https://owasp.org/www-project-application-security-verification-standard/
  document_id: ASVS-V6
authority:
  source:
    type: standard-body
    id: owasp
    name: OWASP Application Security Verification Standard
  level: 4
lifecycle: active
governance:
  classification: hardened-mandate
  approval_required: true
effective_date: "2026-01-01T00:00:00Z"
created_at: "2026-08-07T00:00:00Z"
updated_at: "2026-08-08T00:00:00Z"
owner: opencraft-security
enforcement:
  mode: block
  specification:
    type: secret-scanning
    config:
      scanners: ["gitleaks", "semgrep"]
    violation_message_template: >
      No secrets may be committed; provision from a secret manager at runtime.
metadata:
  pack: security-pack
