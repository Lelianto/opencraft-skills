id: ctx-core-secrets-protection
version: 1
title: Secrets must never be committed or exposed
description: >
  Credentials, tokens, and keys MUST NOT be committed to the repository, build
  logs, client bundles, fixtures, or examples. Secrets are provisioned from a
  secret manager or environment at runtime. Exposed secrets are rotated and
  treated as an incident.
applies_to:
  - "**/*"
category: security
severity: critical
tags: [security, secrets, process]
source:
  type: organization
  uri: https://github.com/Lelianto/opencraft-skills
authority:
  source:
    type: organization
    id: opencraft
    name: OpenCraft
  level: 3
lifecycle: active
governance:
  classification: hardened-standard
  approval_required: true
effective_date: "2026-01-01T00:00:00Z"
created_at: "2026-08-07T00:00:00Z"
updated_at: "2026-08-08T00:00:00Z"
owner: opencraft
enforcement:
  mode: block
  specification:
    type: secret-scanning
    config:
      scanners: ["gitleaks", "semgrep"]
    violation_message_template: >
      No secrets may be committed; provision from a secret manager at runtime.
metadata:
  pack: core-pack
