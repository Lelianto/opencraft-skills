id: ctx-healthcare-consent
version: 1
title: PHI access and sharing must follow recorded consent
description: >
  Accessing or sharing PHI MUST follow the patient's recorded consent. Consent
  records are versioned, capture scope and expiration, and are re-checked at
  the point of access — not only at enrollment. Revocation takes effect
  immediately and is audited.
applies_to:
  - "**/*.ts"
category: compliance
severity: critical
tags: [healthcare, compliance, consent, privacy]
source:
  type: organization
  uri: https://github.com/Lelianto/opencraft-skills
authority:
  source:
    type: organization
    id: opencraft-healthcare
    name: OpenCraft Healthcare
  level: 4
lifecycle: active
governance:
  classification: hardened-mandate
  approval_required: true
effective_date: "2026-01-01T00:00:00Z"
created_at: "2026-08-07T00:00:00Z"
updated_at: "2026-08-08T00:00:00Z"
owner: opencraft-healthcare
enforcement:
  mode: block
  specification:
    type: custom-script
    config:
      command: "node scripts/verify-consent.mjs"
    violation_message_template: >
      PHI access must be checked against recorded, current consent at point of use.
metadata:
  pack: healthcare-pack
