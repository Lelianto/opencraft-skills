name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
      - name: Validate skills
        run: python3 scripts/validate.py
      - name: Validate eval fixtures
        run: python3 scripts/evaluate.py
      - name: Validate HITL contracts
        run: node scripts/validate-hitl.mjs
      - name: Compile pack engine
        run: python3 -m py_compile scripts/packlib/*.py scripts/packtool.py scripts/generate_pack_lock.py scripts/pack-evaluate.py
      - name: Validate Context Packs
        run: |
          python3 scripts/packtool.py packs validate --all
          python3 scripts/pack-evaluate.py
      - name: Run pack engine tests
        run: python3 scripts/packlib_test.py
      - name: Run pack security tests
        run: python3 scripts/security_test.py
      - name: Run pack performance benchmark
        run: python3 scripts/pack-bench.py
      - name: Verify pack integrity lock
        run: python3 scripts/generate_pack_lock.py --check
      - name: Smoke-test pack install (Python + Node parity)
        run: |
          project="$(mktemp -d)"
          printf 'schema: https://opencraft.dev/schema/project-packs/v1\nextends:\n  - nextjs-pack@^1\n  - security-pack@^1\n  - fintech-pack@^1\nconflict_policy: fail\n' > "$project/packs.yaml"
          python3 scripts/packtool.py packs install --project "$project"
          python_out="$project/.lcdd"
          cp -r "$python_out" "$project/py-out"
          node scripts/packtool.mjs packs install --project "$project"
          diff -r "$project/py-out" "$project/.lcdd" --exclude packs.lock.json --exclude report.json
          test -f "$project/.lcdd/CONTEXT.md"
          test -f "$project/.lcdd/packs.lock.json"
      - name: Verify integrity lock
        run: python3 scripts/generate_lock.py --check
      - name: Smoke-test installer
        run: |
          project="$(mktemp -d)"
          python3 scripts/install.py --target all --project "$project" --with-project-files
          expected="$(( $(find skills -mindepth 1 -maxdepth 1 -type d | wc -l) * 5 ))"
          test "$(find "$project" -name SKILL.md | wc -l)" -eq "$expected"
          test -f "$project/.product/traceability.yaml"
          test -f "$project/.product/human-loop.json"
          test -f "$project/.product/schemas/decision-record.schema.json"
          test -f "$project/.ai-skills-install.json"
      - name: Smoke-test npm package
        run: |
          npm pack --dry-run
          project="$(mktemp -d)"
          node scripts/install.mjs install --target all --project "$project" --with-project-files
          expected="$(( $(find skills -mindepth 1 -maxdepth 1 -type d | wc -l) * 5 ))"
          test "$(find "$project" -name SKILL.md | wc -l)" -eq "$expected"
          node scripts/test-decision-cli.mjs
      - name: Verify LCDD interoperability (@lcdd/cli + @lcdd/mcp)
        run: |
          lcdd_dir="$(mktemp -d)"
          npm install --prefix "$lcdd_dir" --no-audit --no-fund @lcdd/cli@^0.5.0 @lcdd/mcp@^0.5.0
          node scripts/check-lcdd-interop.mjs \
            --lcdd-bin "$lcdd_dir/node_modules/.bin/lcd" \
            --mcp-bin "$lcdd_dir/node_modules/.bin/lcdd-mcp"
      - name: Smoke-test packs MCP server
        run: node scripts/test-pack-mcp.mjs
      - name: Smoke-test real-agent eval harness (dry run)
        run: |
          runs_dir="$(mktemp -d)"
          node scripts/run-evals.mjs --dry-run --out "$runs_dir" --skills analyze-product,write-product-prd
          test -f "$runs_dir/with-skill/analyze-product.md"
          test -f "$runs_dir/without-skill/analyze-product.md"
          python3 scripts/evaluate.py --runs "$runs_dir" --skills analyze-product,write-product-prd
