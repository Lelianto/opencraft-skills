name: Publish context packs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag whose packs should be published, for example v1.3.0"
        required: true
        type: string
      dry_run:
        description: "Validate the packs without publishing"
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-packs-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and publish packs
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate packs, catalog, and integrity
        run: |
          python3 scripts/packtool.py packs validate --all
          python3 scripts/pack-evaluate.py
          python3 scripts/generate_pack_catalog.py --check
          python3 scripts/generate_pack_lock.py --check
          python3 scripts/packlib_test.py
          python3 scripts/security_test.py

      - name: Reject existing npm versions
        run: |
          for dir in packs/*/; do
            [ -f "$dir/pack.yaml" ] || continue
            name="$(python3 -c "import sys; from packlib.manifest import load_pack; print(load_pack('$PWD/$dir')['manifest']['name'])" 2>/dev/null)"
            version="$(python3 -c "import sys; from packlib.manifest import load_pack; print(load_pack('$PWD/$dir')['manifest']['version'])" 2>/dev/null)"
            echo "checking @opencraft/$name@$version"
            if npm view "@opencraft/$name@$version" version >/dev/null 2>&1; then
              echo "ERROR @opencraft/$name@$version already exists on npm"
              exit 1
            fi
          done

      - name: Publish packs to npm
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: |
          for dir in packs/*/; do
            [ -f "$dir/pack.yaml" ] || continue
            name="$(basename "$dir")"
            tmp="$(mktemp -d)"
            # Stage the full pack (pack.yaml, contexts, project, ai, README)
            # plus an npm package.json; pack_integrity ignores package.json so
            # the published tarball verifies identically on re-fetch.
            cp -R "$dir/." "$tmp/"
            node -e "
              const fs = require('fs');
              const yaml = fs.readFileSync('$tmp/pack.yaml', 'utf8');
              const m = /^name: (.+)\$/m.exec(yaml);
              const v = /^version: (.+)\$/m.exec(yaml);
              const d = /^description: (.+)\$/m.exec(yaml);
              const pkg = {
                name: '@opencraft/' + (m ? m[1] : '$name'),
                version: v ? v[1] : '0.0.0',
                description: d ? d[1].replace(/^[\"']|[\"']$/g, '') : 'OpenCraft Context Pack',
                files: ['pack.yaml', 'README.md', 'contexts', 'project', 'ai', 'evals'],
                license: 'MIT',
              };
              fs.writeFileSync('$tmp/package.json', JSON.stringify(pkg, null, 2));
            "
            cd "$tmp"
            npm publish --access public
            cd -
            rm -rf "$tmp"
          done